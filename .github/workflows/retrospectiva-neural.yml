name: Produção neural da retrospectiva
on:
  push:
    branches: [producao-retrospectiva-neural]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sintetizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro==0.9.4' soundfile scipy
      - name: Sintetizar e montar
        run: python tools/retrospectiva_neural.py
      - name: Arquivos produzidos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrospectiva-neural
          path: saida-neural/
          retention-days: 14
          if-no-files-found: warn

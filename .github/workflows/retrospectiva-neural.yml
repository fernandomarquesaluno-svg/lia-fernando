name: Produção neural da retrospectiva V2
on:
  push:
    branches: [producao-retrospectiva-neural]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sintetizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro==0.9.4' 'misaki==0.9.4' 'transformers==4.49.0' 'huggingface-hub==0.30.2' 'numpy<2.3' soundfile scipy
          python -m pip check
      - name: Sintetizar e montar
        run: python tools/retrospectiva_neural_v2.py
      - name: Arquivos produzidos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrospectiva-neural-v2
          path: saida-neural-v2/
          retention-days: 30
          if-no-files-found: warn
